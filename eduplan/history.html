<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>History — EduPlan</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,700;1,500&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet"/>
<link rel="stylesheet" href="assets/style.css"/>
<style>
.ep-filter-bar {
  display:flex; align-items:center; gap:10px; flex-wrap:wrap;
  background:#fff; border:1px solid var(--border); border-radius:var(--r-lg);
  padding:14px 18px; margin-bottom:24px; box-shadow:var(--shadow-sm);
}
.ep-filter-bar select { max-width:170px; }
.ep-plan-row {
  display:flex; align-items:center; gap:14px; padding:16px;
  border-bottom:1px solid var(--border); transition:background .12s;
  cursor:pointer;
}
.ep-plan-row:last-child { border-bottom:none; }
.ep-plan-row:hover { background:var(--paler); }
.ep-plan-row__icon { width:40px; height:40px; background:var(--paler); border-radius:10px; display:flex; align-items:center; justify-content:center; flex-shrink:0; }
.ep-plan-row__icon svg { width:18px; height:18px; stroke:var(--pine); fill:none; stroke-width:2; stroke-linecap:round; }
.ep-plan-row__info { flex:1; min-width:0; }
.ep-plan-row__title { font-size:14px; font-weight:600; color:var(--ink); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.ep-plan-row__meta  { font-size:11px; color:var(--ink-soft); margin-top:3px; }
.ep-plan-row__actions { display:flex; gap:6px; }

/* Term group headers */
.ep-term-header {
  display:flex; align-items:center; gap:12px;
  padding:12px 0 8px; margin-top:8px;
}
.ep-term-header h3 { font-family:'Playfair Display',serif; font-size:15px; color:var(--forest); font-weight:700; }
.ep-term-header__count { font-size:11px; color:var(--ink-soft); background:var(--paper-dark); border:1px solid var(--border-mid); border-radius:20px; padding:2px 10px; }

/* Preview modal */
.ep-preview-content { max-height:65vh; overflow-y:auto; font-size:13px; line-height:1.7; }
.ep-preview-content table { width:100%; border-collapse:collapse; font-size:11px; margin:10px 0; }
.ep-preview-content th { background:var(--paler); border:1px solid var(--border-mid); padding:6px 8px; font-size:10px; text-align:left; }
.ep-preview-content td { border:1px solid var(--border-mid); padding:6px 8px; vertical-align:top; }

/* Stats bar */
.ep-history-stats { display:grid; grid-template-columns:repeat(auto-fit,minmax(130px,1fr)); gap:12px; margin-bottom:24px; }
.ep-history-stat { background:#fff; border-radius:var(--r-lg); border:1px solid var(--border); padding:14px 16px; box-shadow:var(--shadow-sm); }
.ep-history-stat__label { font-size:10px; font-weight:700; text-transform:uppercase; letter-spacing:.06em; color:var(--ink-soft); margin-bottom:6px; }
.ep-history-stat__val { font-family:'Playfair Display',serif; font-size:22px; font-weight:700; color:var(--forest); }
</style>
</head>
<body>

<header class="ep-topbar">
  <button class="ep-topbar__menu-btn" onclick="toggleSidebar()">
    <svg viewBox="0 0 24 24"><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
  </button>
  <a href="index.html" class="ep-topbar__brand">
    <div class="ep-topbar__logo"><svg viewBox="0 0 24 24"><path d="M12 20h9"/><path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"/></svg></div>
    <span class="ep-topbar__name">EduPlan</span>
  </a>
  <div class="ep-topbar__actions">
    <div class="ep-topbar__credits" onclick="window.location.href='topup.html'">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="16"/><line x1="8" y1="12" x2="16" y2="12"/></svg>
      <span id="topCredits">— credits</span>
    </div>
    <div class="ep-topbar__avatar" id="avatarBtn">?</div>
  </div>
</header>

<div class="ep-layout">
  <nav class="ep-sidebar" id="sidebar">
    <div class="ep-sidebar__section">
      <div class="ep-sidebar__label">Menu</div>
      <a href="dashboard.html" class="ep-sidebar__link"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/></svg>Dashboard</a>
      <a href="generate.html"  class="ep-sidebar__link"><svg viewBox="0 0 24 24"><path d="M12 2L2 7l10 5 10-5-10-5z"/><path d="M2 17l10 5 10-5"/><path d="M2 12l10 5 10-5"/></svg>Generate Plan</a>
      <a href="submit.html"    class="ep-sidebar__link"><svg viewBox="0 0 24 24"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>Submit Plan</a>
      <a href="history.html"   class="ep-sidebar__link active"><svg viewBox="0 0 24 24"><path d="M12 8v4l3 3m6-3a9 9 0 1 1-18 0 9 9 0 0 1 18 0z"/></svg>History</a>
    </div>
    <div class="ep-sidebar__section" id="schoolSection" style="display:none;">
      <div class="ep-sidebar__label">School</div>
      <a href="review.html" class="ep-sidebar__link"><svg viewBox="0 0 24 24"><path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/></svg>Review Plans</a>
      <a href="admin.html" class="ep-sidebar__link"><svg viewBox="0 0 24 24"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>School Admin</a>
    </div>
    <div class="ep-sidebar__section">
      <div class="ep-sidebar__label">Account</div>
      <a href="topup.html" class="ep-sidebar__link"><svg viewBox="0 0 24 24"><rect x="1" y="4" width="22" height="16" rx="2" ry="2"/><line x1="1" y1="10" x2="23" y2="10"/></svg>Buy Credits</a>
    </div>
    <div class="ep-sidebar__footer">
      <button class="ep-sidebar__link" onclick="Auth.clear();location.href='login.html'" style="color:rgba(255,255,255,.5);">
        <svg viewBox="0 0 24 24"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
        Log out
      </button>
    </div>
  </nav>

  <main class="ep-main">
    <div class="ep-page-header">
      <div class="ep-page-header__eyebrow">Records</div>
      <h1>Plan History</h1>
      <p>All your saved and submitted lesson plans — filtered by term, subject, or status. Click any plan to preview or download.</p>
    </div>

    <!-- Stats -->
    <div class="ep-history-stats" id="histStats"></div>

    <!-- Filters -->
    <div class="ep-filter-bar">
      <svg viewBox="0 0 24 24" width="16" height="16" stroke="var(--ink-soft)" fill="none" stroke-width="2" stroke-linecap="round"><polygon points="22 3 2 3 10 12.46 10 19 14 21 14 12.46 22 3"/></svg>
      <select class="ep-select" id="filterTerm" onchange="renderList()">
        <option value="">All Terms</option>
        <option>First Term</option>
        <option>Second Term</option>
        <option>Third Term</option>
      </select>
      <select class="ep-select" id="filterStatus" onchange="renderList()">
        <option value="">All Statuses</option>
        <option value="draft">Draft</option>
        <option value="pending">Pending Review</option>
        <option value="approved">Approved</option>
        <option value="returned">Returned</option>
      </select>
      <select class="ep-select" id="filterSubject" onchange="renderList()">
        <option value="">All Subjects</option>
      </select>
      <input class="ep-input" id="filterSearch" type="search" placeholder="Search by topic…" oninput="renderList()" style="max-width:220px;"/>
      <button class="ep-btn ep-btn--ghost ep-btn--sm" onclick="clearFilters()">
        <svg viewBox="0 0 24 24"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
        Clear
      </button>
      <a href="generate.html" class="ep-btn ep-btn--primary ep-btn--sm" style="margin-left:auto;">
        <svg viewBox="0 0 24 24"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
        New plan
      </a>
    </div>

    <!-- List -->
    <div class="ep-card" id="histCard">
      <div id="histList"></div>
    </div>

  </main>
</div>

<!-- Preview Modal -->
<div class="ep-modal-overlay" id="previewModal">
  <div class="ep-modal ep-modal--lg">
    <div class="ep-modal__head">
      <h3 id="previewTitle">Lesson Plan Preview</h3>
      <button class="ep-modal__close" onclick="closeModal()">×</button>
    </div>
    <div class="ep-modal__body">
      <div class="ep-preview-content" id="previewContent"></div>
    </div>
    <div class="ep-modal__footer">
      <button class="ep-btn ep-btn--ghost ep-btn--sm" onclick="closeModal()">Close</button>
      <button class="ep-btn ep-btn--danger ep-btn--sm" id="deleteBtn">
        <svg viewBox="0 0 24 24"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14H6L5 6"/><path d="M10 11v6"/><path d="M14 11v6"/><path d="M9 6V4h6v2"/></svg>
        Delete
      </button>
      <button class="ep-btn ep-btn--secondary ep-btn--sm" id="resubmitBtn">
        <svg viewBox="0 0 24 24"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
        Submit
      </button>
      <button class="ep-btn ep-btn--primary ep-btn--sm" id="downloadBtn">
        <svg viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
        Download PDF
      </button>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="assets/config.js"></script>
<script>
const sb = getSupabase();
let user = Auth.get(); // cached

(async () => {
  await Auth.requireAuth();
  user = Auth.get();
document.getElementById("topCredits").textContent = (user.credits||0) + " credits";
document.getElementById("avatarBtn").textContent   = (user.name||"?")[0].toUpperCase();
if (user.type === "school" && ["principal","hod","admin"].includes(user.role)) {
  document.getElementById("schoolSection").style.display = "";
}

let plans = [];
if (user.id && user.id !== "demo") {
  const { data } = await sb.from("plans")
    .select("*")
    .eq("user_id", user.id)
    .order("saved_at", { ascending: false });
  plans = data || [];
  console.log("Plans loaded:", plans.length, plans);
} else {
  plans = JSON.parse(localStorage.getItem("eduplan_plans")||"[]");
}
let activePlanId = null;

// Populate subject filter
const subjects = [...new Set(plans.map(p=>p.subject).filter(Boolean))].sort();
const subjectSel = document.getElementById("filterSubject");
subjects.forEach(s => { const o = document.createElement("option"); o.value=s; o.textContent=s; subjectSel.appendChild(o); });

// Stats
})();

function renderStats() {
  const total    = plans.length;
  const approved = plans.filter(p=>p.status==="approved").length;
  const pending  = plans.filter(p=>p.status==="pending").length;
  const returned = plans.filter(p=>p.status==="returned").length;
  document.getElementById("histStats").innerHTML = `
    <div class="ep-history-stat"><div class="ep-history-stat__label">Total Plans</div><div class="ep-history-stat__val">${total}</div></div>
    <div class="ep-history-stat"><div class="ep-history-stat__label">Approved</div><div class="ep-history-stat__val" style="color:var(--pine);">${approved}</div></div>
    <div class="ep-history-stat"><div class="ep-history-stat__label">Pending</div><div class="ep-history-stat__val" style="color:var(--warning);">${pending}</div></div>
    <div class="ep-history-stat"><div class="ep-history-stat__label">Returned</div><div class="ep-history-stat__val" style="color:var(--danger);">${returned}</div></div>
  `;
}

function renderList() {
  const termF    = document.getElementById("filterTerm").value;
  const statusF  = document.getElementById("filterStatus").value;
  const subjectF = document.getElementById("filterSubject").value;
  const searchF  = document.getElementById("filterSearch").value.toLowerCase();

  let filtered = plans.filter(p => {
    if (termF    && p.term    !== termF)    return false;
    if (statusF  && (p.status||"draft") !== statusF)  return false;
    if (subjectF && p.subject !== subjectF) return false;
    if (searchF  && !(p.title||"").toLowerCase().includes(searchF) && !(p.topic||"").toLowerCase().includes(searchF)) return false;
    return true;
  });

  const list = document.getElementById("histList");

  if (filtered.length === 0) {
    list.innerHTML = `<div style="padding:48px;text-align:center;color:var(--ink-soft);">
      <svg viewBox="0 0 24 24" width="40" height="40" stroke="currentColor" fill="none" stroke-width="1.5" stroke-linecap="round" style="margin:0 auto 12px;display:block;opacity:.4;"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>
      <p>No plans found for the selected filters.</p>
      <a href="generate.html" style="color:var(--sage);font-weight:600;font-size:14px;">Generate your first plan →</a>
    </div>`;
    return;
  }

  // Group by term
  const terms = ["First Term","Second Term","Third Term",""];
  const groups = {};
  filtered.forEach(p => {
    const t = p.term || "Other";
    if (!groups[t]) groups[t] = [];
    groups[t].push(p);
  });

  const termOrder = ["First Term","Second Term","Third Term","Other"];
  let html = "";
  termOrder.forEach(term => {
    if (!groups[term]) return;
    html += `<div class="ep-term-header">
      <h3>${term}</h3>
      <span class="ep-term-header__count">${groups[term].length} plan${groups[term].length!==1?"s":""}</span>
    </div>`;
    groups[term].forEach(p => {
      const statusClass = p.status||"draft";
      const statusLabel = capitalize(p.status||"draft");
      html += `
        <div class="ep-plan-row" onclick="openPlan(${p.id})">
          <div class="ep-plan-row__icon">
            <svg viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>
          </div>
          <div class="ep-plan-row__info">
            <div class="ep-plan-row__title">${esc(p.title||"Untitled Plan")}</div>
            <div class="ep-plan-row__meta">${esc(p.class||"")} · ${esc(p.subject||"")} · Saved ${esc(p.savedAt||"")}${p.submittedAt?" · Submitted "+esc(p.submittedAt):""}</div>
            ${p.reviewComment?`<div style="font-size:11px;color:var(--danger);margin-top:3px;">Reviewer note: ${esc(p.reviewComment)}</div>`:""}
          </div>
          <span class="ep-plan-status ep-plan-status--${statusClass}">${statusLabel}</span>
          <div class="ep-plan-row__actions" onclick="event.stopPropagation()">
            <button class="ep-btn ep-btn--ghost ep-btn--sm" onclick="openPlan(${p.id})">
              <svg viewBox="0 0 24 24"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
              View
            </button>
          </div>
        </div>`;
    });
  });

  list.innerHTML = html;
}

function openPlan(id) {
  activePlanId = id;
  const p = plans.find(x=>x.id===id);
  if (!p) return;
  document.getElementById("previewTitle").textContent = p.title || "Lesson Plan";
  const content = document.getElementById("previewContent");
  content.innerHTML = p.html
    ? `<div style="font-size:13px;">${p.html}</div>`
    : `<p style="color:var(--ink-soft);font-style:italic;">No preview available for this plan.</p>`;

  // Wire buttons
  document.getElementById("deleteBtn").onclick    = () => deletePlan(id);
  document.getElementById("resubmitBtn").onclick  = () => { closeModal(); window.location.href="submit.html"; };
  document.getElementById("downloadBtn").onclick  = () => downloadPlan(p);

  document.getElementById("previewModal").classList.add("open");
}

function closeModal() {
  document.getElementById("previewModal").classList.remove("open");
  activePlanId = null;
}

async function deletePlan(id) {
  if (!confirm("Delete this plan? This cannot be undone.")) return;
  if (user.id && user.id !== "demo") {
    await sb.from("plans").delete().eq("id", id);
  } else {
    plans = plans.filter(p=>p.id!==id);
    localStorage.setItem("eduplan_plans", JSON.stringify(plans));
  }
  plans = plans.filter(p=>p.id!==id);
  closeModal();
  renderStats();
  renderList();
  showToast("Plan deleted.", "info");
}

function downloadPlan(p) {
  if (!p.html) { alert("No content to download."); return; }
  const blob = new Blob(["\ufeff<html><head><meta charset='utf-8'><style>body{font-family:Arial,sans-serif;font-size:12pt;padding:24px}table{width:100%;border-collapse:collapse;margin:10px 0}th,td{border:1px solid #000;padding:6px 8px;font-size:11pt;vertical-align:top}th{background:#e8f5ee;font-size:10pt}</style></head><body>"+p.html+"</body></html>"],{type:"application/msword"});
  const a = document.createElement("a"); a.href=URL.createObjectURL(blob); a.download=(p.title||"lesson-plan")+".doc"; a.click();
}

function clearFilters() {
  document.getElementById("filterTerm").value    = "";
  document.getElementById("filterStatus").value  = "";
  document.getElementById("filterSubject").value = "";
  document.getElementById("filterSearch").value  = "";
  renderList();
}

function esc(s){ return String(s||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }
function capitalize(s){ return s.charAt(0).toUpperCase()+s.slice(1); }
function toggleSidebar(){ document.getElementById("sidebar").classList.toggle("open"); }

// Close modal on overlay click
document.getElementById("previewModal").addEventListener("click", e => {
  if (e.target === e.currentTarget) closeModal();
});

renderStats();
renderList();
</script>
</body>
</html>
